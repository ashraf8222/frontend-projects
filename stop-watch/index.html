<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
         <div class="stopwatch">
                <div class="upper">
                        <div class="watch" id="hour"><h1>00</h1></div>
                        <div class="watch" id="min"><h1>00</h1></div>
                        <div class="watch" id="sec"><h1>00</h1></div>
                        <div class="watch" id="msec"><h1>00</h1></div>
                </div>
                <div class="lower">
                        <div class="button" id="start"><h2>Start</h2></div>
                        <div class="button" id="stop"><h2>Stop</h2></div>
                        <div class="button" id="reset"><h2>Reset</h2></div>
                </div>
         </div>
         <div class="title">
              <h1>STOPWATCH</h1>
         </div>
        <script src="script.js"></script>
    </body>
</html>
