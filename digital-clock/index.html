<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital-Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">
        <div class="section">
            <div class="hour">00</div>
            <div class="h-des"><h4>HOURS</h4></div>
        </div>
        <div class="section">
            <div class="min">00</div>
            <div class="m-des"><h4>MINUTES</h4></div>
        </div>
        <div class="section">
            <div class="sec">00</div>
            <div class="s-des"><h4>SECOND</h4></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
